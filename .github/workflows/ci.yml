name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install Playwright (dev-only)
        run: npm ci --ignore-scripts

      - name: Install Chromium headless
        run: npx playwright install --with-deps --only-shell chromium

      - name: Serve repo statis
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/index.html > /dev/null && exit 0
            sleep 0.5
          done
          echo "Server statis tidak bisa diakses" && cat /tmp/http.log && exit 1

      - name: Jalankan smoke test (38 cek)
        env:
          BASE_URL: http://127.0.0.1:8000
        run: node tests/run-smoke.mjs
